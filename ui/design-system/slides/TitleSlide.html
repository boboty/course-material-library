<!-- @dsCard group="Slides" viewport="1280x720" name="Title Slide" subtitle="Course opener — dark ground" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--grad-dark); color: #fff; font-family: var(--font-sans); }
  .slide::after { content: ""; position: absolute; right: -120px; top: -140px; width: 620px; height: 980px; background: var(--grad-wing); opacity: .16; transform: rotate(8deg); filter: blur(2px); }
  .pad { position: absolute; inset: 0; padding: 88px 96px; display: flex; flex-direction: column; justify-content: space-between; z-index: 2; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .brand img { height: 44px; width: auto; border-radius: 11px; }
  .brand .wm { font-family: var(--font-display); font-weight: 800; font-size: 20px; letter-spacing: -.01em; white-space: nowrap; color: #fff; }
  .brand .wm span { color: var(--emerald-400); }
  .meta { font-family: var(--font-mono); font-size: 13px; letter-spacing: .12em; color: var(--text-on-dark-muted); text-transform: uppercase; }
  .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; letter-spacing: .16em; text-transform: uppercase; color: var(--emerald-300); }
  .eyebrow::before { content: ""; width: 30px; height: 2px; background: var(--emerald-400); }
  h1 { font-family: var(--font-display); font-weight: 800; font-size: 78px; line-height: 1.04; letter-spacing: -.025em; margin: 26px 0 0; max-width: 1000px; color: #fff; }
  .sub { font-size: 23px; color: var(--text-on-dark); opacity: .82; margin-top: 22px; max-width: 760px; line-height: 1.5; }
  .foot { display: flex; align-items: center; gap: 26px; }
  .foot .who { display: flex; flex-direction: column; gap: 3px; }
  .foot .who b { font-family: var(--font-display); font-weight: 700; font-size: 17px; }
  .foot .who span { font-size: 14px; color: var(--text-on-dark-muted); }
  .divider { width: 1px; height: 40px; background: var(--border-on-dark); }
</style>
</head>
<body>
  <div class="slide">
    <div class="pad">
      <div class="top">
        <div class="brand">
          <img src="../assets/logo-appicon.png" alt="">
          <div class="wm">BenYan<span> AI</span></div>
        </div>
        <div class="meta">企业 AI 赋能课程</div>
      </div>
      <div>
        <span class="eyebrow">AI 洞察及应用 · Module 01</span>
        <h1>从 AI 洞察<br>到企业级落地</h1>
        <p class="sub">一套结构化的方法论，把大模型能力转化为可复用、可评估、可规模化的业务工作流。</p>
      </div>
      <div class="foot">
        <div class="who"><b>研习 · BenYan AI</b><span>企业 AI 应用研究院</span></div>
        <div class="divider"></div>
        <div class="who"><b>2026 春季 · 高管研修班</b><span>Day 1 · 09:30–12:00</span></div>
      </div>
    </div>
  </div>
</body>
</html>
