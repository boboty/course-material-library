<!-- @dsCard group="Spacing" viewport="700x170" name="Spacing Scale" subtitle="4px base unit, 1 → 13" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-page); }
  .row { display: flex; align-items: flex-end; gap: 14px; }
  .item { display: flex; flex-direction: column; gap: 6px; align-items: center; }
  .bar { background: var(--emerald-200); border-radius: 3px; width: 100%; }
  .v { font-family: var(--font-mono); font-size: 10px; color: var(--text-muted); }
  .item > .bar { width: 22px; }
</style>
</head>
<body>
  <div class="row">
    <div class="item"><div class="bar" style="height:4px"></div><span class="v">1·4</span></div>
    <div class="item"><div class="bar" style="height:8px"></div><span class="v">2·8</span></div>
    <div class="item"><div class="bar" style="height:12px"></div><span class="v">3·12</span></div>
    <div class="item"><div class="bar" style="height:16px"></div><span class="v">4·16</span></div>
    <div class="item"><div class="bar" style="height:24px"></div><span class="v">6·24</span></div>
    <div class="item"><div class="bar" style="height:32px"></div><span class="v">7·32</span></div>
    <div class="item"><div class="bar" style="height:48px"></div><span class="v">9·48</span></div>
    <div class="item"><div class="bar" style="height:64px"></div><span class="v">10·64</span></div>
    <div class="item"><div class="bar" style="height:80px"></div><span class="v">11·80</span></div>
    <div class="item"><div class="bar" style="height:96px"></div><span class="v">12·96</span></div>
  </div>
</body>
</html>
