<!-- @dsCard group="Spacing" viewport="700x160" name="Corner Radii" subtitle="Soft, professional — pills reserved for tags" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-page); display: flex; gap: 18px; align-items: flex-end; }
  .item { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .box { width: 72px; height: 60px; background: var(--white); border: 1.5px solid var(--brand); border-bottom: none; }
  .v { font-family: var(--font-mono); font-size: 11px; color: var(--text-muted); }
</style>
</head>
<body>
  <div class="item"><div class="box" style="border-radius:4px 4px 0 0"></div><span class="v">xs · 4</span></div>
  <div class="item"><div class="box" style="border-radius:6px 6px 0 0"></div><span class="v">sm · 6</span></div>
  <div class="item"><div class="box" style="border-radius:10px 10px 0 0"></div><span class="v">md · 10</span></div>
  <div class="item"><div class="box" style="border-radius:14px 14px 0 0"></div><span class="v">lg · 14</span></div>
  <div class="item"><div class="box" style="border-radius:20px 20px 0 0"></div><span class="v">xl · 20</span></div>
  <div class="item"><div class="box" style="border-radius:28px 28px 0 0"></div><span class="v">2xl · 28</span></div>
</body>
</html>
