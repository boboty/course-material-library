<!-- @dsCard group="Slides" viewport="1280x720" name="Section Divider" subtitle="Module break — emerald ground" -->
<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  html, body { margin: 0; }
  .slide { width: 1280px; height: 720px; position: relative; overflow: hidden; background: var(--emerald-900); color: #fff; font-family: var(--font-sans); display: flex; }
  .num { flex: 0 0 460px; display: flex; align-items: center; justify-content: center; position: relative; }
  .num::before { content: ""; position: absolute; right: 0; top: 14%; bottom: 14%; width: 1px; background: rgba(255,255,255,.16); }
  .num b { font-family: var(--font-mono); font-weight: 600; font-size: 280px; line-height: 1; color: transparent; -webkit-text-stroke: 2px var(--emerald-400); letter-spacing: -.04em; }
  .body { flex: 1; padding: 0 96px; display: flex; flex-direction: column; justify-content: center; gap: 24px; }
  .eyebrow { display: inline-flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; letter-spacing: .18em; text-transform: uppercase; color: var(--emerald-300); }
  .eyebrow::before { content: ""; width: 30px; height: 2px; background: var(--emerald-400); }
  h2 { font-family: var(--font-display); font-weight: 800; font-size: 64px; line-height: 1.06; letter-spacing: -.025em; margin: 0; color: #fff; }
  p { font-size: 21px; line-height: 1.55; color: rgba(255,255,255,.78); max-width: 560px; margin: 0; }
  .chips { display: flex; gap: 10px; margin-top: 8px; }
  .chip { font-size: 13px; font-weight: 600; padding: 6px 14px; border-radius: 999px; background: rgba(215,243,236,.12); color: var(--emerald-200); border: 1px solid rgba(143,217,200,.3); }
</style>
</head>
<body>
  <div class="slide">
    <div class="num"><b>02</b></div>
    <div class="body">
      <span class="eyebrow">研发体系建设 · Methodology</span>
      <h2>把 AI 研发<br>沉淀为体系</h2>
      <p>从工具试用走向工程化能力：评估标准、协作流程、复用资产与质量门禁。</p>
      <div class="chips"><span class="chip">评估清单</span><span class="chip">交付模板</span><span class="chip">质量门禁</span></div>
    </div>
  </div>
</body>
</html>
