<!-- @dsCard group="Colors" viewport="700x180" name="Semantic & Functional" subtitle="Text, surface and status roles in use" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); display: grid; grid-template-columns: 1.3fr 1fr; gap: 16px; }
  .panel { background: var(--surface-card); border: 1px solid var(--border-subtle); border-radius: var(--radius-md); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .ttl { font-family: var(--font-mono); font-size: 10px; letter-spacing: .1em; text-transform: uppercase; color: var(--text-faint); margin-bottom: 10px; }
  .line { display: flex; align-items: center; gap: 9px; margin-bottom: 7px; }
  .dot { width: 14px; height: 14px; border-radius: 4px; border: 1px solid var(--border-subtle); }
  .t { font-size: 13px; }
  .status { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill { font-size: 12px; font-weight: 600; padding: 4px 11px; border-radius: var(--radius-pill); }
</style>
</head>
<body>
  <div class="panel">
    <div class="ttl">Text on paper</div>
    <div class="line"><span class="dot" style="background:#141b21"></span><span class="t" style="color:var(--text-strong)">Strong — headings</span></div>
    <div class="line"><span class="dot" style="background:#1f2933"></span><span class="t" style="color:var(--text-body)">Body — default copy</span></div>
    <div class="line"><span class="dot" style="background:#5b6b78"></span><span class="t" style="color:var(--text-muted)">Muted — secondary</span></div>
    <div class="line"><span class="dot" style="background:#0c7361"></span><span class="t" style="color:var(--text-brand)">Brand — links / accent</span></div>
  </div>
  <div class="panel">
    <div class="ttl">Status accents</div>
    <div class="status">
      <span class="pill" style="background:var(--emerald-100);color:var(--emerald-800)">Success</span>
      <span class="pill" style="background:var(--amber-100);color:var(--amber-500)">Warning</span>
      <span class="pill" style="background:var(--rose-100);color:var(--rose-500)">Risk</span>
      <span class="pill" style="background:var(--blue-100);color:var(--blue-500)">Info</span>
    </div>
    <div class="ttl" style="margin-top:16px">Surfaces</div>
    <div class="status">
      <span class="pill" style="background:var(--paper);color:var(--text-muted);border:1px solid var(--border-default)">Page</span>
      <span class="pill" style="background:var(--surface-dark);color:#fff">Dark</span>
      <span class="pill" style="background:var(--surface-brand-soft);color:var(--emerald-800)">Brand soft</span>
    </div>
  </div>
</body>
</html>
