<!-- @dsCard group="Type" viewport="700x230" name="Type Scale" subtitle="Modular scale, 11 → 86px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--surface-page); }
  .r { display: flex; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--border-subtle); padding: 6px 0; }
  .r:last-child { border-bottom: 0; }
  .px { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); width: 52px; flex: none; }
  .sp { font-family: var(--font-display); font-weight: 700; color: var(--text-strong); white-space: nowrap; letter-spacing: -.02em; }
</style>
</head>
<body>
  <div class="r"><span class="px">86</span><span class="sp" style="font-size:46px">Display</span></div>
  <div class="r"><span class="px">54</span><span class="sp" style="font-size:40px">Headline</span></div>
  <div class="r"><span class="px">33</span><span class="sp" style="font-size:30px">Title</span></div>
  <div class="r"><span class="px">21</span><span class="sp" style="font-size:21px">Subtitle</span></div>
  <div class="r"><span class="px">16</span><span class="sp" style="font-size:16px;font-weight:400;font-family:var(--font-sans)">Body — base reading size</span></div>
  <div class="r"><span class="px">13</span><span class="sp" style="font-size:13px;font-weight:600;font-family:var(--font-sans);letter-spacing:.12em;text-transform:uppercase;color:var(--text-brand)">Eyebrow</span></div>
</body>
</html>
