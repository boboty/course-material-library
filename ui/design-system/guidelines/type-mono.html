<!-- @dsCard group="Type" viewport="700x170" name="Mono — JetBrains" subtitle="Data, metrics, code & technical labels" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-page); display: flex; flex-direction: column; gap: 12px; }
  .big { font-family: var(--font-mono); font-weight: 600; font-size: 34px; color: var(--text-strong); letter-spacing: -.01em; }
  .big span { color: var(--brand); }
  .lbl { font-family: var(--font-mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--text-muted); }
  .code { font-family: var(--font-mono); font-size: 13px; color: var(--text-body); background: var(--surface-sunken); border: 1px solid var(--border-subtle); border-radius: var(--radius-sm); padding: 8px 12px; width: fit-content; }
</style>
</head>
<body>
  <div class="big">+38<span>%</span> · 12wk · ROI 4.2×</div>
  <div class="lbl">KPI / METRIC LABEL</div>
  <div class="code">model.evaluate(workflow, rubric)</div>
</body>
</html>
