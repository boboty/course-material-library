<!-- @dsCard group="Type" viewport="700x200" name="Display — Manrope" subtitle="Headlines & titles, ExtraBold, tight tracking" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 26px; background: var(--surface-page); }
  .d1 { font-family: var(--font-display); font-weight: 800; font-size: 52px; line-height: 1.05; letter-spacing: -.025em; color: var(--text-strong); }
  .d2 { font-family: var(--font-display); font-weight: 700; font-size: 30px; line-height: 1.1; letter-spacing: -.02em; color: var(--text-strong); margin-top: 12px; }
  .em { color: var(--brand); }
  .meta { font-family: var(--font-mono); font-size: 11px; color: var(--text-faint); margin-top: 16px; letter-spacing: .03em; }
</style>
</head>
<body>
  <div class="d1">AI 洞察<span class="em">·</span>应用与落地</div>
  <div class="d2">From insight to enterprise impact</div>
  <div class="meta">Manrope · 800 / 700 · letter-spacing −0.025em → −0.02em</div>
</body>
</html>
