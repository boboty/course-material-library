[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "benyan-webapp-starter"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3",
  "pydantic-settings>=2,<3", "sqlalchemy>=2,<3", "alembic>=1.13,<2",
  "asyncpg>=0.29,<1", "greenlet>=3,<4"
]

[project.optional-dependencies]
dev = ["httpx2>=2.0,<3", "pytest>=8,<10", "ruff>=0.9,<1", "pyright>=1.1,<2", "pre-commit>=4,<5"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
include = ["app", "tests", "alembic"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
