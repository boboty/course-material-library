<!-- @dsCard group="Colors" viewport="700x140" name="Ink Scale" subtitle="Charcoal-navy neutrals, 50 → 900" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px; background: var(--surface-page); }
  .ramp { display: grid; grid-template-columns: repeat(10, 1fr); border-radius: var(--radius-md); overflow: hidden; box-shadow: var(--shadow-sm); }
  .cell { height: 64px; display: flex; align-items: flex-end; justify-content: center; padding-bottom: 6px; font-family: var(--font-mono); font-size: 10px; }
</style>
</head>
<body>
  <div class="ramp">
    <div class="cell" style="background:#f2f4f5;color:#415362">50</div>
    <div class="cell" style="background:#e7ebee;color:#415362">100</div>
    <div class="cell" style="background:#cfd6db;color:#2c3a45">200</div>
    <div class="cell" style="background:#a7b1b9;color:#141b21">300</div>
    <div class="cell" style="background:#7d8a94;color:#fff">400</div>
    <div class="cell" style="background:#5b6b78;color:#fff">500</div>
    <div class="cell" style="background:#415362;color:#fff">600</div>
    <div class="cell" style="background:#2c3a45;color:#fff">700</div>
    <div class="cell" style="background:#1f2933;color:#fff">800</div>
    <div class="cell" style="background:#141b21;color:#fff">900</div>
  </div>
</body>
</html>
