services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-benyan}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-benyan_local}
      POSTGRES_DB: ${POSTGRES_DB:-benyan}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
volumes:
  postgres_data:
