<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 26px; background: var(--surface-page); display: grid; grid-template-columns: repeat(4,1fr); gap: 14px; }
  .g { height: 96px; border-radius: var(--radius-md); display: flex; align-items: flex-end; padding: 10px; box-shadow: var(--shadow-sm); }
  .v { font-family: var(--font-mono); font-size: 10px; color: #fff; background: rgba(0,0,0,.18); padding: 2px 7px; border-radius: 4px; }
  .v.dark { color: var(--text-muted); background: var(--white); }
</style>
</head>
<body>
  <div class="g" style="background:var(--grad-wing)"><span class="v">wing</span></div>
  <div class="g" style="background:var(--grad-brand)"><span class="v">brand</span></div>
  <div class="g" style="background:var(--grad-dark)"><span class="v">dark</span></div>
  <div class="g" style="background:var(--grad-mint-fade);border:1px solid var(--border-subtle)"><span class="v dark">mint fade</span></div>
</body>
</html>
